spring:
  application:
    name: compliance
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/compliance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:compliance}
    password: ${SPRING_DATASOURCE_PASSWORD:local-only-compliance}
  flyway:
    # Starter tables (outbox, local_audit, processed_event, consumed_aggregate_version) are V0_x;
    # this service's own migrations in db/migration start at V1.
    locations: classpath:db/spectrace-platform,classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:spectrace}
    password: ${RABBITMQ_PASSWORD:local-only-rabbitmq}
  jdbc:
    template:
      query-timeout: 5s
server:
  port: ${SERVER_PORT:8080}
management:
  endpoint:
    health:
      group:
        readiness:
          # The broker is not a readiness dependency: committed events wait in the outbox.
          include: readinessState,db
