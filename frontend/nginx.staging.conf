server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ALB must route these to the real Gateway/Keycloak, never to SPA HTML.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location = /auth { return 404; }
    location ^~ /auth/ { return 404; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /g1-release.json {
        add_header Cache-Control "no-store";
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
