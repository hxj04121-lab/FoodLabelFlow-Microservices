spring:
  application:
    name: __SERVICE__
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/__DATABASE__?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:__DATABASE__}
    password: ${SPRING_DATASOURCE_PASSWORD:local-only-__DATABASE__}
  flyway:
    locations: classpath:db/migration
  jdbc:
    template:
      query-timeout: 5s
server:
  port: ${SERVER_PORT:8080}
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
