name: G3 demo acceptance
on:
  pull_request:
    branches: [main, feature/stcn-16-g3-m1]
    paths: ['perf/demo/**', 'perf/data/**', 'docs/swe5001/data/demo-soy-lecithin-expected.json', '.github/workflows/g3-demo-acceptance.yml']
  push:
    branches: [fix/m2-g3-demo-acceptance]
permissions:
  contents: read
jobs:
  demo-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify seed expectations and reject unobserved asynchronous PASS
        run: |
          set -o pipefail
          python -m unittest discover -s perf/demo -v 2>&1 | tee demo-regression.log
          python perf/data/demo_soy_lecithin.py
          git diff --exit-code -- docs/swe5001/data/demo-soy-lecithin-expected.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-regression-evidence
          path: demo-regression.log
          if-no-files-found: error
