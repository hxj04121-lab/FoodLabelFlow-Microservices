name: SWE5001 Compliance contracts
on:
  pull_request:
    paths: ['services/compliance/**', 'contracts/**', '.github/workflows/swe5001-compliance.yml']
  push:
    branches: ['codex/g2-m2-compliance-phase1', 'feature/g3-m2-compliance']
permissions:
  contents: read
jobs:
  compliance-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Verify all frozen contracts and targets
        working-directory: contracts
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run check:integration
