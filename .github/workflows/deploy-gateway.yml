name: Protected Gateway staging release

on:
  workflow_dispatch:
    inputs:
      staging_window_hours:
        description: User-approved staging window length in hours
        type: number
        required: true
      staging_window_end_sgt:
        description: User-confirmed staging shutdown time in Asia/Singapore (YYYY-MM-DD HH:MM)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: gateway-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, staging-vpc]
    environment: staging
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      GATEWAY_ISSUER: ${{ vars.GATEWAY_ISSUER }}
      APPROVED_STAGING_SPEND_USD: ${{ secrets.APPROVED_STAGING_SPEND_USD }}
      STAGING_WINDOW_HOURS: ${{ inputs.staging_window_hours }}
      STAGING_WINDOW_END_SGT: ${{ inputs.staging_window_end_sgt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deploy/helm/package-lock.json
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Require protected deploy role and runtime configuration
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_REGION"
          test -n "$EKS_CLUSTER_NAME"
          test -n "$AWS_ROLE_ARN"
          test -n "$GATEWAY_ISSUER"
          python3 platform/staging/validate_window.py "$STAGING_WINDOW_HOURS" "$STAGING_WINDOW_END_SGT" > "$RUNNER_TEMP/staging-window.json"
          npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/helm
          npm test --prefix deploy/helm
          python3 -m unittest discover -s tests -p 'test_gateway_deploy_*.py' -v
          python3 -m unittest discover -s tests -p 'test_staging_window.py' -v
          python3 platform/gateway/deploy-runtime-values.py > "$RUNNER_TEMP/gateway-runtime-values.json"
          python3 - "$RUNNER_TEMP/gateway-runtime-values.json" <<'PY'
          import json, sys
          values=json.load(open(sys.argv[1]))
          origins={row['name']:row['value'] for row in values['env']}.get('GATEWAY_ALLOWED_ORIGINS','')
          if origins!='https://hxj04121-lab.github.io,https://staging.52zzx.top' or '*' in origins:
              raise SystemExit('The reviewed PR #72 staging-root CORS origin must be merged before the protected Gateway release.')
          PY
          if ! env -u AVAILABLE_CREDIT_USD python3 scripts/aws_staging_budget.py --require-gate --hours 24 --experiment-hours 4 --k6-hours 2 > "$RUNNER_TEMP/gateway-budget-gate.log" 2>&1; then
            echo '::error::The existing fail-closed staging funding/pricing gate did not pass; no cluster write was attempted.'
            exit 1
          fi
          echo 'Approved staging funding and pricing gate passed.'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify target and capture the existing Gateway release
        run: |
          set -euo pipefail
          identity=$(aws sts get-caller-identity --query 'Arn' --output text)
          cluster_arn=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.arn' --output text)
          test "$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.status' --output text)" = ACTIVE
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
          context=$(kubectl config current-context)
          python3 platform/gateway/validate-deploy-target.py \
            --account-id "$AWS_ACCOUNT_ID" --role-arn "$AWS_ROLE_ARN" --caller-arn "$identity" \
            --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME" --cluster-arn "$cluster_arn" --context "$context"
          kubectl get namespace gateway >/dev/null
          helm list --namespace gateway --filter '^gateway$' --output json > "$RUNNER_TEMP/gateway-release.json"
          python3 - "$RUNNER_TEMP/gateway-release.json" <<'PY'
          import json, sys
          releases=json.load(open(sys.argv[1]))
          if len(releases)!=1 or releases[0].get('name')!='gateway' or releases[0].get('status')!='deployed':
              raise SystemExit('Expected exactly one deployed Helm release named gateway in namespace gateway.')
          PY
          helm status gateway --namespace gateway > "$RUNNER_TEMP/gateway-release-status.txt"
          helm get values gateway --namespace gateway --all --output json > "$RUNNER_TEMP/gateway-current-values.json"
          helm get manifest gateway --namespace gateway > "$RUNNER_TEMP/gateway-current-manifest.yaml"
          python3 - "$RUNNER_TEMP/gateway-current-values.json" "$RUNNER_TEMP/gateway-current-values-sanitized.json" <<'PY'
          import json, sys
          values=json.load(open(sys.argv[1]))
          network=values.get('networkPolicy',{})
          safe={
              'serviceName':values.get('serviceName'),
              'replicaCount':values.get('replicaCount'),
              'image':{key:values.get('image',{}).get(key) for key in ('repository','tag','digest','pullPolicy')},
              'containerPort':values.get('containerPort'),
              'service':values.get('service',{}),
              'nodeSelector':values.get('nodeSelector',{}),
              'probes':values.get('probes',{}),
              'networkPolicy':{'enabled':network.get('enabled'),'ingressFromCIDRs':network.get('ingressFromCIDRs',[]),'ingressFromPeers':network.get('ingressFromPeers',[])},
              'targetGroupArn':values.get('targetGroupArn')
          }
          json.dump(safe,open(sys.argv[2],'w'),indent=2)
          PY
          kubectl get deployment gateway-gateway --namespace gateway -o json > "$RUNNER_TEMP/gateway-current-deployment.json"
          kubectl get targetgroupbindings.elbv2.k8s.aws gateway-gateway --namespace gateway -o json > "$RUNNER_TEMP/gateway-current-tgb.json"
          kubectl get networkpolicy gateway-gateway --namespace gateway -o json > "$RUNNER_TEMP/gateway-current-networkpolicy.json"
          target_group_arn=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["spec"]["targetGroupARN"])' "$RUNNER_TEMP/gateway-current-tgb.json")
          aws elbv2 describe-target-health --target-group-arn "$target_group_arn" > "$RUNNER_TEMP/gateway-current-target-health.json"
          python3 - "$RUNNER_TEMP/gateway-current-target-health.json" <<'PY'
          import json, sys
          targets=json.load(open(sys.argv[1])).get('TargetHealthDescriptions',[])
          if not targets or any(row.get('TargetHealth',{}).get('State')!='healthy' for row in targets):
              raise SystemExit('Existing Gateway Target Group must have at least one Healthy target before upgrade.')
          PY
          for resource in deployments services serviceaccounts networkpolicies targetgroupbindings.elbv2.k8s.aws; do
            for verb in get list watch patch update; do
              test "$(kubectl auth can-i "$verb" "$resource" --namespace gateway)" = yes
            done
          done
          for resource in pods endpointslices; do
            for verb in get list watch; do
              test "$(kubectl auth can-i "$verb" "$resource" --namespace gateway)" = yes
            done
          done
          for verb in get list create update patch; do
            test "$(kubectl auth can-i "$verb" secrets --namespace gateway)" = yes
          done
          test "$(kubectl auth can-i create pods/portforward --namespace gateway)" = yes
      - name: Verify anonymous GHCR pull for the pinned linux/amd64 image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          repository='hxj04121-lab/foodlabelflow-microservices/gateway'
          expected='sha256:d4190ea6ee31b84e7b67d36ad56e6391612c8bdc4916b8bb14d28b9a17f6ab47'
          token_url='https://ghcr.io/token?'+urllib.parse.urlencode({'scope':f'repository:{repository}:pull','service':'ghcr.io'})
          token=json.load(urllib.request.urlopen(token_url,timeout=20))['token']
          headers={'Authorization':'Bearer '+token,'Accept':', '.join(['application/vnd.oci.image.index.v1+json','application/vnd.docker.distribution.manifest.list.v2+json','application/vnd.oci.image.manifest.v1+json','application/vnd.docker.distribution.manifest.v2+json'])}
          request=urllib.request.Request(f'https://ghcr.io/v2/{repository}/manifests/{expected}',headers=headers)
          with urllib.request.urlopen(request,timeout=20) as response:
              manifest=json.load(response)
              if response.headers.get('Docker-Content-Digest')!=expected or manifest.get('mediaType') not in ('application/vnd.oci.image.manifest.v1+json','application/vnd.docker.distribution.manifest.v2+json'):
                  raise SystemExit('Pinned digest changed or is not a single-platform image manifest')
          config_digest=manifest['config']['digest']
          request=urllib.request.Request(f'https://ghcr.io/v2/{repository}/blobs/{config_digest}',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(request,timeout=20) as response:
              image=json.load(response)
          if image.get('os')!='linux' or image.get('architecture')!='amd64':
              raise SystemExit('Pinned image config is not linux/amd64')
          print('Anonymous GHCR pull verified for the pinned linux/amd64 image; no registry credential was used.')
          PY
      - name: Lint and render pinned Gateway chart
        run: |
          set -euo pipefail
          helm lint deploy/helm/spectrace-service --strict --values "$RUNNER_TEMP/gateway-current-values.json" --values "$RUNNER_TEMP/gateway-runtime-values.json"
          helm template gateway deploy/helm/spectrace-service --namespace gateway \
            --values "$RUNNER_TEMP/gateway-current-values.json" --values "$RUNNER_TEMP/gateway-runtime-values.json" \
            > "$RUNNER_TEMP/gateway-rendered.yaml"
          grep -Fq 'ghcr.io/hxj04121-lab/foodlabelflow-microservices/gateway@sha256:d4190ea6ee31b84e7b67d36ad56e6391612c8bdc4916b8bb14d28b9a17f6ab47' "$RUNNER_TEMP/gateway-rendered.yaml"
          node deploy/helm/check-gateway-upgrade.mjs "$RUNNER_TEMP/gateway-current-manifest.yaml" "$RUNNER_TEMP/gateway-rendered.yaml" \
            | tee "$RUNNER_TEMP/gateway-manifest-diff.txt"
      - name: Dry-run and upgrade the existing Gateway release
        id: gateway_upgrade
        run: |
          set -euo pipefail
          if ! helm upgrade gateway deploy/helm/spectrace-service --namespace gateway --reset-values \
            --values "$RUNNER_TEMP/gateway-current-values.json" --values "$RUNNER_TEMP/gateway-runtime-values.json" \
            --dry-run=server --debug > "$RUNNER_TEMP/gateway-dry-run.log" 2>&1; then
            echo '::error::Gateway server dry-run failed; no upgrade was applied.'
            exit 1
          fi
          helm upgrade gateway deploy/helm/spectrace-service --namespace gateway --reset-values \
            --values "$RUNNER_TEMP/gateway-current-values.json" --values "$RUNNER_TEMP/gateway-runtime-values.json" \
            --atomic --wait --timeout 10m
          echo upgraded=true >> "$GITHUB_OUTPUT"
          kubectl get targetgroupbindings.elbv2.k8s.aws gateway-gateway --namespace gateway -o json > "$RUNNER_TEMP/gateway-updated-tgb.json"
          kubectl get networkpolicy gateway-gateway --namespace gateway -o json > "$RUNNER_TEMP/gateway-updated-networkpolicy.json"
          target_group_arn=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["spec"]["targetGroupARN"])' "$RUNNER_TEMP/gateway-updated-tgb.json")
          aws elbv2 describe-target-health --target-group-arn "$target_group_arn" > "$RUNNER_TEMP/gateway-updated-target-health.json"
          python3 - "$RUNNER_TEMP/gateway-updated-target-health.json" <<'PY'
          import json, sys
          targets=json.load(open(sys.argv[1])).get('TargetHealthDescriptions',[])
          if not targets or any(row.get('TargetHealth',{}).get('State')!='healthy' for row in targets):
              raise SystemExit('Gateway Target Group must return to Healthy after upgrade.')
          PY
          python3 - "$RUNNER_TEMP/gateway-current-tgb.json" "$RUNNER_TEMP/gateway-updated-tgb.json" "$RUNNER_TEMP/gateway-current-networkpolicy.json" "$RUNNER_TEMP/gateway-updated-networkpolicy.json" <<'PY'
          import json, sys
          before_tgb, after_tgb, before_np, after_np = [json.load(open(path)) for path in sys.argv[1:]]
          assert before_tgb['spec']==after_tgb['spec'], 'Gateway TargetGroupBinding changed during upgrade'
          assert before_np['spec']==after_np['spec'], 'Gateway NetworkPolicy or ALB CIDRs changed during upgrade'
          PY
          kubectl rollout status deployment/gateway-gateway --namespace gateway --timeout=5m
          kubectl wait --for=condition=Available deployment/gateway-gateway --namespace gateway --timeout=60s
          kubectl get deployment gateway-gateway --namespace gateway -o json > "$RUNNER_TEMP/gateway-updated-deployment.json"
          kubectl get pods --namespace gateway -l app.kubernetes.io/instance=gateway -o json > "$RUNNER_TEMP/gateway-pods.json"
          kubectl get service gateway-gateway --namespace gateway -o json > "$RUNNER_TEMP/gateway-service.json"
          for attempt in $(seq 1 30); do
            kubectl get endpointslices --namespace gateway -l kubernetes.io/service-name=gateway-gateway -o json > "$RUNNER_TEMP/gateway-endpoints.json"
            if python3 - "$RUNNER_TEMP/gateway-endpoints.json" <<'PY'
          import json, sys
          endpoints=[ep for sl in json.load(open(sys.argv[1]))['items'] for ep in sl.get('endpoints',[]) if ep.get('conditions',{}).get('ready')]
          raise SystemExit(0 if endpoints else 1)
          PY
            then break; fi
            sleep 2
          done
          python3 - "$RUNNER_TEMP/gateway-pods.json" "$RUNNER_TEMP/gateway-endpoints.json" <<'PY'
          import json, sys
          pods=json.load(open(sys.argv[1]))['items']
          assert len(pods)==1, f'expected exactly one Gateway Pod, found {len(pods)}'
          pod=pods[0]
          assert pod['status'].get('phase')=='Running'
          statuses=pod['status'].get('containerStatuses',[])
          assert len(statuses)==1 and statuses[0].get('ready') is True and statuses[0].get('restartCount')==0
          assert statuses[0].get('imageID','').endswith('@sha256:d4190ea6ee31b84e7b67d36ad56e6391612c8bdc4916b8bb14d28b9a17f6ab47')
          endpoints=[ep for sl in json.load(open(sys.argv[2]))['items'] for ep in sl.get('endpoints',[]) if ep.get('conditions',{}).get('ready')]
          assert endpoints, 'no ready EndpointSlice address targets the Gateway Pod'
          PY
      - name: Verify in-cluster readiness through the ClusterIP Service
        run: |
          set -euo pipefail
          kubectl port-forward --namespace gateway service/gateway-gateway 18080:8080 > "$RUNNER_TEMP/gateway-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/actuator/health/readiness > "$RUNNER_TEMP/gateway-readiness.json"; then break; fi
            sleep 2
          done
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1])).get("status")=="UP"' "$RUNNER_TEMP/gateway-readiness.json"
          mkdir -p "$RUNNER_TEMP/gateway-evidence"
          python3 - "$RUNNER_TEMP/gateway-pods.json" "$RUNNER_TEMP/gateway-service.json" "$RUNNER_TEMP/gateway-endpoints.json" "$RUNNER_TEMP/gateway-readiness.json" "$RUNNER_TEMP/gateway-evidence/summary.json" <<'PY'
          import json, sys
          pods=json.load(open(sys.argv[1]))['items']
          service=json.load(open(sys.argv[2]))
          slices=json.load(open(sys.argv[3]))['items']
          readiness=json.load(open(sys.argv[4]))
          result={
              'pod': {'name':pods[0]['metadata']['name'],'phase':pods[0]['status']['phase'],'ready':pods[0]['status']['containerStatuses'][0]['ready'],'image':pods[0]['spec']['containers'][0]['image'],'imageID':pods[0]['status']['containerStatuses'][0]['imageID'],'restartCount':pods[0]['status']['containerStatuses'][0]['restartCount']},
              'deployment':'gateway-gateway Available',
              'service':{'name':service['metadata']['name'],'type':service['spec']['type'],'clusterIP':service['spec']['clusterIP']},
              'readyEndpointAddresses':[ep['addresses'] for sl in slices for ep in sl.get('endpoints',[]) if ep.get('conditions',{}).get('ready')],
              'readinessHTTP':200,'readiness':readiness,
              'commit':__import__('os').environ['GITHUB_SHA']
          }
          open(sys.argv[5],'w').write(json.dumps(result,indent=2)+'\n')
          PY
      - name: Verify public authentication, OIDC and CORS behavior
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway-evidence"
          for origin in https://hxj04121-lab.github.io https://staging.52zzx.top; do
            headers="$RUNNER_TEMP/gateway-evidence/preflight-$(echo "$origin" | sed 's#https://##;s#/#-#g').headers"
            status=$(curl --silent --show-error --max-time 20 -X OPTIONS \
              -H "Origin: $origin" -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: authorization,content-type' \
              -o /dev/null -D "$headers" -w '%{http_code}' \
              https://staging.52zzx.top/api/formulations/products)
            [[ "$status" == 200 || "$status" == 204 ]]
            allow_origin=$(awk -F': ' 'tolower($1)=="access-control-allow-origin"{gsub("\r","",$2);print $2}' "$headers")
            allow_methods=$(awk -F': ' 'tolower($1)=="access-control-allow-methods"{gsub("\r","",$2);print tolower($2)}' "$headers")
            allow_headers=$(awk -F': ' 'tolower($1)=="access-control-allow-headers"{gsub("\r","",$2);print tolower($2)}' "$headers")
            test "$allow_origin" = "$origin"
            [[ "$allow_methods" == *get* ]]
            [[ "$allow_headers" == *authorization* && "$allow_headers" == *content-type* ]]
          done
          invalid_headers="$RUNNER_TEMP/gateway-evidence/preflight-invalid-origin.headers"
          invalid_status=$(curl --silent --show-error --max-time 20 -X OPTIONS \
            -H 'Origin: https://not-allowed.example' -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            -o /dev/null -D "$invalid_headers" -w '%{http_code}' \
            https://staging.52zzx.top/api/formulations/products)
          test "$invalid_status" = 403
          test -z "$(awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}' "$invalid_headers")"
          api_status=$(curl --silent --show-error --max-time 20 -o "$RUNNER_TEMP/gateway-evidence/anonymous-api.json" \
            -D "$RUNNER_TEMP/gateway-evidence/anonymous-api.headers" -w '%{http_code}' \
            https://staging.52zzx.top/api/formulations/products)
          test "$api_status" = 401
          grep -qi '^www-authenticate: Bearer' "$RUNNER_TEMP/gateway-evidence/anonymous-api.headers"
          curl --fail --silent --show-error --max-time 20 \
            https://staging.52zzx.top/auth/realms/spectrace/.well-known/openid-configuration \
            -o "$RUNNER_TEMP/gateway-evidence/oidc-discovery.json"
          python3 - "$RUNNER_TEMP/gateway-evidence/oidc-discovery.json" "$GATEWAY_ISSUER" <<'PY'
          import json, sys
          assert json.load(open(sys.argv[1])).get('issuer')==sys.argv[2]
          PY
          echo "PASS: Pages/staging preflights allowed; unknown origin rejected; API returned 401 Bearer; Keycloak discovery matched issuer." \
            > "$RUNNER_TEMP/gateway-evidence/public-smoke.txt"
      - name: Roll back failed Gateway acceptance
        if: failure() && steps.gateway_upgrade.outputs.upgraded == 'true'
        run: |
          set -euo pipefail
          helm rollback gateway 0 --namespace gateway --wait --timeout 10m
          echo 'Gateway release rolled back to its previous revision after acceptance failure.' \
            > "$RUNNER_TEMP/gateway-evidence/rollback.txt"
      - name: Save sanitized Gateway release evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gateway-evidence"
          cp "$RUNNER_TEMP/staging-window.json" "$RUNNER_TEMP/gateway-evidence/staging-window.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/gateway-release-status.txt" "$RUNNER_TEMP/gateway-evidence/release-status.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/gateway-current-values-sanitized.json" "$RUNNER_TEMP/gateway-evidence/current-values-sanitized.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/gateway-current-deployment.json" "$RUNNER_TEMP/gateway-evidence/deployment-before.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/gateway-updated-deployment.json" "$RUNNER_TEMP/gateway-evidence/deployment-after.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/gateway-manifest-diff.txt" "$RUNNER_TEMP/gateway-evidence/manifest-diff.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/gateway-runtime-values.json" "$RUNNER_TEMP/gateway-evidence/runtime-values.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/gateway-current-tgb.json" "$RUNNER_TEMP/gateway-evidence/current-targetgroupbinding.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/gateway-updated-networkpolicy.json" "$RUNNER_TEMP/gateway-evidence/networkpolicy.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/gateway-updated-target-health.json" "$RUNNER_TEMP/gateway-evidence/target-health.json" 2>/dev/null || true
          if [[ ! -f "$RUNNER_TEMP/gateway-evidence/rollback.txt" ]]; then
            echo 'not-needed' > "$RUNNER_TEMP/gateway-evidence/rollback.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-staging-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/gateway-evidence/
          if-no-files-found: ignore
          retention-days: 14
