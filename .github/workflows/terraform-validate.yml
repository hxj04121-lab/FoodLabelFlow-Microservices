name: Terraform validation

on:
  push:
    paths:
      - "infra/terraform/**"
      - "infra/aws-staging-budget.json"
      - "platform/staging/validate_window.py"
      - ".github/workflows/terraform-validate.yml"
      - "scripts/*eks_addons.sh"
      - "scripts/aws_staging_budget.py"
      - "scripts/verify_staging_target_network.py"
      - "scripts/terraform_plan_summary.py"
      - "scripts/staging/guard_staging_ownership.py"
      - "scripts/staging/guard_staging_plan_actions.py"
      - "tests/test_staging_plan_action_guard.py"
      - "scripts/staging/staging-ownership-allowlist.json"
      - "tests/test_aws_staging_budget.py"
      - "tests/test_staging_window.py"
      - "tests/test_verify_eks_addons.py"
      - "tests/test_staging_target_network.py"
      - "tests/test_terraform_plan_summary.py"
      - "tests/test_terraform_plan_workflow_guard.py"
      - "tests/test_staging_ownership_guard.py"
      - "tests/test_staging_plan_action_guard.py"
      - "deploy/kubernetes/staging/ebs-gp3-storageclass.yaml.tmpl"
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/aws-staging-budget.json"
      - "platform/staging/validate_window.py"
      - ".github/workflows/terraform-validate.yml"
      - "scripts/*eks_addons.sh"
      - "scripts/aws_staging_budget.py"
      - "scripts/verify_staging_target_network.py"
      - "scripts/terraform_plan_summary.py"
      - "scripts/staging/guard_staging_ownership.py"
      - "scripts/staging/guard_staging_plan_actions.py"
      - "tests/test_staging_plan_action_guard.py"
      - "scripts/staging/staging-ownership-allowlist.json"
      - "tests/test_aws_staging_budget.py"
      - "tests/test_staging_window.py"
      - "tests/test_verify_eks_addons.py"
      - "tests/test_staging_target_network.py"
      - "tests/test_terraform_plan_summary.py"
      - "tests/test_terraform_plan_workflow_guard.py"
      - "tests/test_staging_ownership_guard.py"
      - "tests/test_staging_plan_action_guard.py"
      - "deploy/kubernetes/staging/ebs-gp3-storageclass.yaml.tmpl"
  workflow_dispatch:
    inputs:
      run_plan:
        description: Run a read-only plan against the staging account
        required: true
        type: boolean
        default: false
      expected_state_version_id:
        description: Fresh VersionId from head-object for spectrace/staging/terraform.tfstate
        required: true
        type: string
      staging_window_hours:
        description: Modeled deployment duration (maximum 24 hours)
        required: false
        type: number
        default: 24
      experiment_hours:
        description: Planned compliance scale-out hours
        required: false
        type: number
        default: 4
      k6_hours:
        description: Planned k6 load-test hours
        required: false
        type: number
        default: 2
      staging_window_end_sgt:
        description: Owner-confirmed shutdown time in Asia/Singapore (YYYY-MM-DD HH:MM)
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
      - name: Verify read-only readiness checks with offline fixtures
        run: |
          python3 -m unittest discover -s tests -p test_verify_eks_addons.py -v
          python3 -m unittest discover -s tests -p test_staging_target_network.py -v
      - name: Verify redacted Terraform plan summary and protected-resource guard
        run: |
          python3 -m unittest discover -s tests -p test_terraform_plan_summary.py -v
          python3 -m unittest discover -s tests -p test_terraform_plan_workflow_guard.py -v
          python3 -m unittest discover -s tests -p test_staging_ownership_guard.py -v
          python3 -m unittest discover -s tests -p test_staging_plan_action_guard.py -v
      - name: Verify deployment safety without AWS writes
        run: terraform test -filter=tests/deployment-safety.tftest.hcl
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/modules/github-oidc
      - run: terraform test -no-color
        working-directory: infra/terraform/modules/github-oidc
      - name: Test edge security group and HTTPS listener policy
        run: |
          terraform -chdir=infra/terraform/modules/edge init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/edge test -no-color
      - name: Test RDS security group source restriction
        run: |
          terraform -chdir=infra/terraform/modules/rds init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/rds test -no-color

  plan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_plan }}
    needs: validate
    runs-on: [self-hosted, linux, staging-vpc]
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      STAGING_TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      STAGING_CLUSTER_NAME: spectrace-staging
      TF_PLAN_VARS_JSON: ${{ secrets.TF_PLAN_VARS_JSON }}
      EXPECTED_STATE_VERSION_ID: ${{ inputs.expected_state_version_id }}
      STAGING_WINDOW_HOURS: ${{ inputs.staging_window_hours }}
      EXPERIMENT_HOURS: ${{ inputs.experiment_hours }}
      K6_HOURS: ${{ inputs.k6_hours }}
      STAGING_WINDOW_END_SGT: ${{ inputs.staging_window_end_sgt }}
      M5_TF_TEMP_SUFFIX: foodlabelflow-m5-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Validate the modeled staging window and publish the cost estimate
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX"
          chmod 700 "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX"
          test -n "$STAGING_WINDOW_HOURS" && test -n "$STAGING_WINDOW_END_SGT"
          python3 platform/staging/validate_window.py "$STAGING_WINDOW_HOURS" "$STAGING_WINDOW_END_SGT" > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging-window.json"
          {
            echo '## Modeled staging window'
            echo '```json'
            cat "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging-window.json"
            echo '```'
            echo
            echo '## Estimated staging cost (credit remains unverified)'
            echo '```text'
            python3 scripts/aws_staging_budget.py --hours "$STAGING_WINDOW_HOURS" \
              --experiment-hours "$EXPERIMENT_HOURS" --k6-hours "$K6_HOURS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require the existing S3 state backend and plan role configuration
        run: |
          test -n "$AWS_ACCOUNT_ID" && test -n "$AWS_ROLE_ARN" && test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY" && test -n "$STAGING_TF_WORKSPACE" && test -n "$TF_PLAN_VARS_JSON"
          test -n "$EXPECTED_STATE_VERSION_ID"
          test "$AWS_ACCOUNT_ID" = 679857346122
          test "$TF_STATE_BUCKET" = foodlabelflow-staging-tfstate-679857346122-ap-southeast-1
          test "$TF_STATE_KEY" = terraform.tfstate
          test "$STAGING_TF_WORKSPACE" = staging
          umask 077
          printf '%s' "$TF_PLAN_VARS_JSON" > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging.tfvars.json"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify the AWS account and existing staging state object
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key spectrace/staging/terraform.tfstate \
            --query '{VersionId:VersionId,LastModified:LastModified,Size:ContentLength}' --output json > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging-state-head.json"
          actual_version_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["VersionId"])' "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging-state-head.json")"
          test "$actual_version_id" != "None" && test "$actual_version_id" != "null"
          test "$actual_version_id" = "$EXPECTED_STATE_VERSION_ID"
          {
            echo '## Existing staging Terraform State'
            echo 'S3 key: `spectrace/staging/terraform.tfstate` (existing object required; no workspace creation or state migration)'
            echo 'The supplied CloudShell VersionId must match this object before planning; an unchanged VersionId does not prove there is no AWS drift.'
            echo '```json'
            cat "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging-state-head.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Initialize the existing protected state
        working-directory: infra/terraform
        run: |
          umask 077
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" \
            -backend-config="workspace_key_prefix=spectrace" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true" > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-init.log" 2>&1
          terraform workspace select "$STAGING_TF_WORKSPACE" > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-workspace.log" 2>&1
          test "$(terraform workspace show)" = "$STAGING_TF_WORKSPACE"
          terraform state list > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-state-addresses.txt"
          aws eks update-kubeconfig --name "$STAGING_CLUSTER_NAME" --region "$AWS_REGION" \
            --kubeconfig "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kubeconfig" --alias "$STAGING_CLUSTER_NAME"
          test "$(kubectl --kubeconfig "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kubeconfig" config current-context)" = "$STAGING_CLUSTER_NAME"
          kubectl --kubeconfig "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kubeconfig" \
            get deployments -n kube-system --server-print=true --no-headers \
            > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kube-system-deployments.txt"
          kubectl --kubeconfig "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kubeconfig" \
            get networkpolicies --all-namespaces -o name \
            > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/network-policy-names.txt"
          kubectl --kubeconfig "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kubeconfig" \
            get namespaces --server-print=true --no-headers \
            > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/namespace-names.txt"
          kubectl --kubeconfig "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kubeconfig" \
            get deployment aws-load-balancer-controller -n kube-system \
            -o json \
            | python3 -c 'import json,sys; m=json.load(sys.stdin)["metadata"]; print("\t".join((m.get("labels",{}).get("app.kubernetes.io/managed-by",""),m.get("annotations",{}).get("meta.helm.sh/release-name",""),m.get("annotations",{}).get("meta.helm.sh/release-namespace",""))))' \
            > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/lbc-helm-owner.txt"
          rbac_inventory="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/managed-rbac-resources.txt"
          : > "$rbac_inventory"
          record_namespaced_rbac() {
            kind="$1"
            name="$2"
            namespace="$3"
            resource="$(kubectl --kubeconfig "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kubeconfig" \
              get "$kind" "$name" -n "$namespace" \
              --ignore-not-found -o name)"
            if test -n "$resource"; then
              printf '%s\t%s\t%s\n' "$kind" "$name" "$namespace" >> "$rbac_inventory"
            fi
          }
          for namespace in gateway keycloak frontend; do
            for kind in Role RoleBinding; do record_namespaced_rbac "$kind" spectrace-staging-deployer-custom-resources "$namespace"; done
          done
          for kind in Role RoleBinding; do record_namespaced_rbac "$kind" spectrace-staging-deployer-keycloak-resource keycloak; done
          for kind in Role RoleBinding; do record_namespaced_rbac "$kind" spectrace-staging-deployer-rabbitmq rabbitmq; done
          for namespace in gateway keycloak observability specification formulation compliance label-workflow; do
            for kind in Role RoleBinding; do record_namespaced_rbac "$kind" spectrace-staging-deployer-rabbitmq "$namespace"; done
          done
          for kind in ClusterRole ClusterRoleBinding; do
            resource="$(kubectl --kubeconfig "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kubeconfig" \
              get "$kind" spectrace-staging-node-reader --ignore-not-found -o name)"
            if test -n "$resource"; then printf '%s\tspectrace-staging-node-reader\tcluster\n' "$kind" >> "$rbac_inventory"; fi
          done
          platform_inventory="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/platform-resources.txt"
          platform_error="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/platform-read-error.txt"
          : > "$platform_inventory"
          if aws eks describe-addon --cluster-name "$STAGING_CLUSTER_NAME" --addon-name aws-ebs-csi-driver \
            --query addon.addonName --output text > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/ebs-addon-name.txt" 2> "$platform_error"; then
            printf 'eks-addon\taws-ebs-csi-driver\n' >> "$platform_inventory"
          elif ! grep -Fq 'ResourceNotFoundException' "$platform_error"; then
            echo '::error::Unable to inspect the EBS CSI add-on; stopped before Terraform Plan.'
            exit 1
          fi
          storage_class="$(kubectl --kubeconfig "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kubeconfig" \
            get storageclass ebs-gp3 --ignore-not-found -o name)"
          if test -n "$storage_class"; then printf 'storageclass\tebs-gp3\n' >> "$platform_inventory"; fi
          lbc_role_name=spectrace-staging-aws_load_balancer_controller
          lbc_policy_name=spectrace-staging-aws-load-balancer-controller
          lbc_role_arn="arn:aws:iam::$AWS_ACCOUNT_ID:role/$lbc_role_name"
          lbc_policy_arn="arn:aws:iam::$AWS_ACCOUNT_ID:policy/$lbc_policy_name"
          iam_inventory="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/iam-resources.txt"
          iam_error="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/iam-read-error.txt"
          iam_role_name="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/iam-role-name.txt"
          iam_policy_name="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/iam-policy-name.txt"
          iam_attachment_name="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/iam-attachment-name.txt"
          : > "$iam_inventory"
          if aws iam get-role --role-name "$lbc_role_name" --query Role.Arn --output text > "$iam_role_name" 2> "$iam_error"; then
            printf 'role\t%s\n' "$(cat "$iam_role_name")" >> "$iam_inventory"
          elif ! grep -Fq 'NoSuchEntity' "$iam_error"; then
            echo '::error::Unable to inspect the existing controller IAM role; stopped before Terraform Plan.'
            exit 1
          fi
          if aws iam get-policy --policy-arn "$lbc_policy_arn" \
            --query Policy.Arn --output text > "$iam_policy_name" 2> "$iam_error"; then
            printf 'policy\t%s\n' "$(cat "$iam_policy_name")" >> "$iam_inventory"
          elif ! grep -Fq 'NoSuchEntity' "$iam_error"; then
            echo '::error::Unable to inspect the existing controller IAM policy; stopped before Terraform Plan.'
            exit 1
          fi
          if grep -Fxq "$lbc_role_arn" "$iam_role_name"; then
            if aws iam list-attached-role-policies --role-name "$lbc_role_name" \
              --query "AttachedPolicies[?PolicyArn=='$lbc_policy_arn'].PolicyArn" --output text \
              > "$iam_attachment_name" 2> "$iam_error"; then
              if grep -Fxq "$lbc_policy_arn" "$iam_attachment_name"; then
                printf 'attachment\t%s\t%s\n' "$lbc_role_arn" "$lbc_policy_arn" >> "$iam_inventory"
              fi
            else
              echo '::error::Unable to inspect the existing controller IAM policy attachment; stopped before Terraform Plan.'
              exit 1
            fi
          fi
          python3 "$GITHUB_WORKSPACE/scripts/staging/guard_staging_ownership.py" \
            --state-addresses "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-state-addresses.txt" \
            --deployments "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/kube-system-deployments.txt" \
            --network-policies "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/network-policy-names.txt" \
            --namespaces "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/namespace-names.txt" \
            --iam-resources "$iam_inventory" \
            --rbac-resources "$rbac_inventory" \
            --platform-resources "$platform_inventory" \
            --lbc-helm-owner "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/lbc-helm-owner.txt" \
            --allowlist "$GITHUB_WORKSPACE/scripts/staging/staging-ownership-allowlist.json" \
            --aws-account-id "$AWS_ACCOUNT_ID" \
            --cluster-name "$STAGING_CLUSTER_NAME" \
            --manage-load-balancer-controller false \
            >> "$GITHUB_STEP_SUMMARY"
          {
            printf -- '- LBC IAM role ARN (read-only): `%s`\n' "$(cat "$iam_role_name")"
            printf -- '- LBC IAM policy ARN (read-only): `%s`\n' "$(cat "$iam_policy_name")"
          } >> "$GITHUB_STEP_SUMMARY"
          grep -Fxq 'module.eks[0].aws_eks_cluster.this' "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-state-addresses.txt"
          grep -Fxq 'module.network.aws_vpc.this' "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-state-addresses.txt"
          grep -Fxq 'module.eks[0].aws_eks_node_group.general' "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-state-addresses.txt"
          grep -Fxq 'module.rds[0].aws_db_instance.this' "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-state-addresses.txt"
          grep -Fxq 'module.edge[0].aws_lb.this' "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-state-addresses.txt"
          grep -Fxq 'module.edge[0].aws_lb_target_group.gateway' "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-state-addresses.txt"
          {
            echo '## Existing Terraform ownership checks'
            echo 'Verified workspace: `staging`; required VPC, EKS cluster/general node group, RDS, ALB, and Gateway target-group addresses are present.'
            for address in \
              'module.eks_addons[0].helm_release.load_balancer_controller' \
              'module.eks_addons[0].helm_release.load_balancer_controller[0]' \
              'module.eks_addons[0].aws_iam_role.addons["aws_load_balancer_controller"]' \
              'module.eks_addons[0].aws_iam_policy.load_balancer_controller' \
              'module.eks_addons[0].aws_iam_policy.load_balancer_controller[0]' \
              'module.eks_addons[0].aws_iam_role_policy_attachment.load_balancer_controller' \
              'module.eks_addons[0].aws_iam_role_policy_attachment.load_balancer_controller[0]' \
              'module.eks_addons[0].helm_release.network_policies' \
              'module.eks_addons[0].helm_release.cluster_autoscaler' \
              'module.eks_addons[0].helm_release.metrics_server' \
              'module.eks_addons[0].kubernetes_manifest.deployer_custom_resource_role["gateway"]' \
              'module.eks_addons[0].kubernetes_manifest.deployer_custom_resource_role["keycloak"]' \
              'module.eks_addons[0].kubernetes_manifest.deployer_custom_resource_role["frontend"]' \
              'module.eks_addons[0].kubernetes_manifest.deployer_custom_resource_rolebinding["gateway"]' \
              'module.eks_addons[0].kubernetes_manifest.deployer_custom_resource_rolebinding["keycloak"]' \
              'module.eks_addons[0].kubernetes_manifest.deployer_custom_resource_rolebinding["frontend"]' \
              'module.eks_addons[0].kubernetes_manifest.keycloak_resource_role' \
              'module.eks_addons[0].kubernetes_manifest.keycloak_resource_rolebinding' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["gateway"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["keycloak"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["rabbitmq"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["observability"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["specification"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["formulation"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["compliance"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["label-workflow"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["frontend"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["rabbitmq-system"]' \
              'module.eks_addons[0].kubernetes_manifest.workload_namespace["keycloak-system"]'; do
              if grep -Fxq "$address" "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-state-addresses.txt"; then
                printf -- '- `%s`: owned by Terraform State; inspect its planned action.\n' "$address"
              else
                case "$address" in
                  'module.eks_addons[0].helm_release.load_balancer_controller'|\
                  'module.eks_addons[0].helm_release.load_balancer_controller[0]'|\
                  'module.eks_addons[0].aws_iam_role.addons["aws_load_balancer_controller"]'|\
                  'module.eks_addons[0].aws_iam_policy.load_balancer_controller'|\
                  'module.eks_addons[0].aws_iam_policy.load_balancer_controller[0]'|\
                  'module.eks_addons[0].aws_iam_role_policy_attachment.load_balancer_controller'|\
                  'module.eks_addons[0].aws_iam_role_policy_attachment.load_balancer_controller[0]'|\
                  'module.eks_addons[0].kubernetes_manifest.workload_namespace["gateway"]'|\
                  'module.eks_addons[0].kubernetes_manifest.workload_namespace["keycloak"]'|\
                  'module.eks_addons[0].kubernetes_manifest.workload_namespace["keycloak-system"]')
                    printf -- '- `%s`: reviewed independent owner; creation is disabled and the Plan action guard forbids any operation.\n' "$address"
                    ;;
                  *) printf -- '- `%s`: not in Terraform State; verified by the live ownership guard before Plan.\n' "$address" ;;
                esac
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the complete read-only plan privately
        working-directory: infra/terraform
        run: |
          umask 077
          if ! terraform plan -input=false -no-color -var-file="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging.tfvars.json" \
            -var=enable_eks=true -var=enable_eks_addons=true -var=manage_vpc_cni=false \
            -var=manage_load_balancer_controller=false \
            -var='existing_namespaces=["gateway","keycloak","keycloak-system"]' \
            -var=general_desired_size=3 -var=enable_compliance_node_group=true -var=compliance_desired_size=1 \
            -out="$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging.tfplan" > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/terraform-plan.log" 2>&1; then
            echo '::error::Read-only plan failed; inspect the restricted runner log. No Apply was executed.'
            exit 1
          fi
      - name: Verify State version remained unchanged during Plan
        run: |
          set -euo pipefail
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key spectrace/staging/terraform.tfstate \
            --query '{VersionId:VersionId,LastModified:LastModified,Size:ContentLength}' --output json > "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging-state-head-after.json"
          after_version_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["VersionId"])' "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging-state-head-after.json")"
          test "$after_version_id" != "None" && test "$after_version_id" != "null"
          test "$after_version_id" = "$EXPECTED_STATE_VERSION_ID"
          echo 'S3 State VersionId was unchanged before and after this read-only Plan. This does not prove absence of AWS drift.' >> "$GITHUB_STEP_SUMMARY"
      - name: Reject protected ALB, ACM, LBC, and namespace changes
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          if ! terraform show -json "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging.tfplan" \
            | python3 "$GITHUB_WORKSPACE/scripts/staging/guard_staging_plan_actions.py" >> "$GITHUB_STEP_SUMMARY"; then
            echo '::error::A protected resource action or invalid Plan JSON was detected. The Plan job is blocked.'
            exit 1
          fi
      - name: Publish resource actions without plan values
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          if ! terraform show -json "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging.tfplan" | python3 "$GITHUB_WORKSPACE/scripts/terraform_plan_summary.py" >> "$GITHUB_STEP_SUMMARY"; then
            echo '::error::The redacted plan summary failed or found a protected foundation delete/replacement; no Apply was executed.'
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX/staging.tfplan"
          echo "Read-only plan completed for source $GITHUB_SHA. No Apply was executed."
      - name: Remove private Terraform plan artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" "$RUNNER_TEMP/$M5_TF_TEMP_SUFFIX" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          runner_temp = Path(sys.argv[1]).resolve()
          plan_dir = Path(sys.argv[2])
          if plan_dir.parent.resolve() != runner_temp or not plan_dir.name.startswith("foodlabelflow-m5-plan-"):
              raise SystemExit("refusing to remove a path outside the dedicated Plan temp directory")
          if plan_dir.is_symlink():
              plan_dir.unlink()
          elif plan_dir.exists():
              shutil.rmtree(plan_dir)
          PY
