name: Terraform validation

on:
  push:
    paths: ["infra/terraform/**", ".github/workflows/terraform-validate.yml", "scripts/*eks_addons.sh", "tests/test_verify_eks_addons.py"]
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform-validate.yml", "scripts/*eks_addons.sh", "tests/test_verify_eks_addons.py"]
  workflow_dispatch:
    inputs:
      run_plan:
        description: Run a read-only plan against the staging account
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
      - name: Verify read-only readiness checks with offline fixtures
        run: python3 -m unittest discover -s tests -p test_verify_eks_addons.py -v
      - name: Verify deployment safety without AWS writes
        run: terraform test -filter=tests/deployment-safety.tftest.hcl
        working-directory: infra/terraform

  plan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_plan }}
    needs: validate
    runs-on: [self-hosted, linux, staging-vpc]
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      AWS_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      STAGING_TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      TF_PLAN_VARS_JSON: ${{ secrets.TF_PLAN_VARS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Require state backend and IAM role configuration
        run: |
          test -n "$AWS_ROLE_ARN" && test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY" && test -n "$STAGING_TF_WORKSPACE" && test -n "$TF_PLAN_VARS_JSON"
          umask 077
          printf '%s' "$TF_PLAN_VARS_JSON" > "$RUNNER_TEMP/staging.tfvars.json"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize the existing protected state
        working-directory: infra/terraform
        run: |
          umask 077
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true" > "$RUNNER_TEMP/terraform-init.log" 2>&1
          terraform workspace select "$STAGING_TF_WORKSPACE" > "$RUNNER_TEMP/terraform-workspace.log" 2>&1
          terraform state list > "$RUNNER_TEMP/terraform-state-addresses.txt"
          grep -Fxq 'module.eks[0].aws_eks_cluster.this' "$RUNNER_TEMP/terraform-state-addresses.txt"
          grep -Fxq 'module.network.aws_vpc.this' "$RUNNER_TEMP/terraform-state-addresses.txt"
          grep -Fxq 'module.rds[0].aws_db_instance.this' "$RUNNER_TEMP/terraform-state-addresses.txt"
          grep -Fxq 'module.edge[0].aws_lb.this' "$RUNNER_TEMP/terraform-state-addresses.txt"
      - name: Save the complete read-only plan privately
        working-directory: infra/terraform
        run: |
          umask 077
          if ! terraform plan -input=false -no-color -var-file="$RUNNER_TEMP/staging.tfvars.json" \
            -out="$RUNNER_TEMP/staging.tfplan" > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            echo '::error::Read-only plan failed; inspect the restricted runner log. No Apply was executed.'
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/staging.tfplan"
          echo "Read-only plan completed for source $GITHUB_SHA. No Apply was executed."
