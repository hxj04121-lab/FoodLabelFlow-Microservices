name: SWE5001 Helm template
on:
  pull_request:
    paths: ['deploy/helm/**', 'deploy/kubernetes/staging/rabbitmq/**', 'platform/gateway/**', 'tests/test_gateway_deploy_*.py', 'docs/swe5001/G1-M2-node-pool-interface.md', '.github/workflows/deploy-gateway.yml', '.github/workflows/swe5001-helm.yml']
  push:
    branches: ['feature/stcn-48-*']
    paths: ['deploy/helm/**', 'platform/gateway/**', 'tests/test_gateway_deploy_*.py', 'docs/swe5001/G1-M2-node-pool-interface.md', '.github/workflows/deploy-gateway.yml', '.github/workflows/swe5001-helm.yml']
permissions:
  contents: read
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deploy/helm/package-lock.json
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Lint and test shared chart locally
        working-directory: deploy/helm
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
      - name: Validate protected Gateway runtime and target configuration
        run: python3 -m unittest discover -s tests -p 'test_gateway_deploy_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helm-template-evidence
          path: deploy/helm/.evidence/
          include-hidden-files: true
          if-no-files-found: error
