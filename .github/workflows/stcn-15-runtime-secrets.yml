name: STCN-15 staging runtime Secrets

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply service runtime Secrets before deployment, or delete them during approved cleanup
        required: true
        type: choice
        options: [apply, delete]
      staging_window_hours:
        description: Owner-approved staging window length in hours (required for apply)
        type: number
        required: false
      experiment_hours:
        description: Planned experiment hours included in the spend gate
        type: number
        required: false
      k6_hours:
        description: Planned k6 hours included in the spend gate
        type: number
        required: false
      staging_window_end_sgt:
        description: Owner-confirmed shutdown time in Asia/Singapore (YYYY-MM-DD HH:MM)
        type: string
        required: false

permissions:
  contents: read

jobs:
  runtime-secrets:
    if: ${{ github.ref == 'refs/heads/main' && (vars.STAGING_WINDOW_OPEN == 'true' || inputs.operation == 'delete') }}
    runs-on: [self-hosted, linux, staging-vpc]
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: spectrace-staging-runtime-secrets
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGING_WINDOW_HOURS: ${{ inputs.staging_window_hours }}
      STAGING_EXPERIMENT_HOURS: ${{ inputs.experiment_hours }}
      STAGING_K6_HOURS: ${{ inputs.k6_hours }}
      STAGING_WINDOW_END_SGT: ${{ inputs.staging_window_end_sgt }}
    steps:
      - uses: actions/checkout@v4
      - name: Require an approved cost window and deployment role
        if: ${{ inputs.operation == 'apply' }}
        env:
          APPROVED_STAGING_SPEND_USD: ${{ secrets.APPROVED_STAGING_SPEND_USD }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          : "${STAGING_WINDOW_HOURS:?set the approved staging window duration}"
          : "${STAGING_EXPERIMENT_HOURS:?set the approved experiment duration}"
          : "${STAGING_K6_HOURS:?set the approved k6 duration}"
          : "${STAGING_WINDOW_END_SGT:?set the owner-confirmed shutdown time in Asia/Singapore}"
          : "${APPROVED_STAGING_SPEND_USD:?set the owner-approved staging spend cap}"
          test -n "$AWS_DEPLOY_ROLE_ARN" && test "$AWS_DEPLOY_ROLE_ARN" != "$AWS_PLAN_ROLE_ARN"
          python3 platform/staging/validate_window.py "$STAGING_WINDOW_HOURS" "$STAGING_WINDOW_END_SGT" > "$RUNNER_TEMP/staging-window.json"
          python3 scripts/aws_staging_budget.py \
            --hours "$STAGING_WINDOW_HOURS" \
            --experiment-hours "$STAGING_EXPERIMENT_HOURS" \
            --k6-hours "$STAGING_K6_HOURS" \
            --approved-spend-usd "$APPROVED_STAGING_SPEND_USD" \
            --require-gate
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify target account and configure the private EKS context
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          test "$AWS_REGION" = ap-southeast-1
          test "$AWS_ACCOUNT_ID" = "$(aws sts get-caller-identity --query Account --output text)"
          test "$EKS_CLUSTER_NAME" = spectrace-staging
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Apply or remove per-service runtime configuration Secrets
        env:
          OPERATION: ${{ inputs.operation }}
          STAGING_WINDOW_OPEN: ${{ vars.STAGING_WINDOW_OPEN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          MYSQL_HOST: ${{ vars.MYSQL_HOST }}
          RABBITMQ_HOST: ${{ vars.RABBITMQ_HOST }}
          GATEWAY_ISSUER: ${{ vars.GATEWAY_ISSUER }}
          SPECTRACE_SECURITY_JWKSETURI: ${{ vars.SPECTRACE_SECURITY_JWKSETURI }}
          SPECIFICATION_DB_PASSWORD: ${{ secrets.SPECIFICATION_DB_PASSWORD }}
          FORMULATION_DB_PASSWORD: ${{ secrets.FORMULATION_DB_PASSWORD }}
          COMPLIANCE_DB_PASSWORD: ${{ secrets.COMPLIANCE_DB_PASSWORD }}
          LABEL_WORKFLOW_DB_PASSWORD: ${{ secrets.LABEL_WORKFLOW_DB_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: bash scripts/staging/apply-runtime-secrets.sh "$OPERATION"
