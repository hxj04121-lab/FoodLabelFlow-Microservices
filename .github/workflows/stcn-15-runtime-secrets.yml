name: STCN-15 staging runtime Secrets

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply service runtime Secrets before deployment, or delete them during approved cleanup
        required: true
        type: choice
        options: [apply, delete]
      staging_window_hours:
        description: Owner-approved staging window length in hours (required for apply)
        type: number
        required: false
      experiment_hours:
        description: Planned experiment hours included in the spend gate
        type: number
        required: false
      k6_hours:
        description: Planned k6 hours included in the spend gate
        type: number
        required: false
      staging_window_end_sgt:
        description: Owner-confirmed shutdown time in Asia/Singapore (YYYY-MM-DD HH:MM)
        type: string
        required: false

permissions:
  contents: read

jobs:
  runtime-secrets:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.operation == 'apply' || inputs.operation == 'delete') }}
    runs-on: [self-hosted, linux, staging-vpc]
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: spectrace-staging-runtime-secrets
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGING_WINDOW_HOURS: ${{ inputs.staging_window_hours }}
      STAGING_EXPERIMENT_HOURS: ${{ inputs.experiment_hours }}
      STAGING_K6_HOURS: ${{ inputs.k6_hours }}
      STAGING_WINDOW_END_SGT: ${{ inputs.staging_window_end_sgt }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      GATEWAY_ISSUER: ${{ vars.GATEWAY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - name: Require an approved cost window and deployment role
        if: ${{ inputs.operation == 'apply' }}
        env:
          APPROVED_STAGING_SPEND_USD: ${{ secrets.APPROVED_STAGING_SPEND_USD }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          SPECIFICATION_DB_PASSWORD: ${{ secrets.SPECIFICATION_DB_PASSWORD }}
          FORMULATION_DB_PASSWORD: ${{ secrets.FORMULATION_DB_PASSWORD }}
          COMPLIANCE_DB_PASSWORD: ${{ secrets.COMPLIANCE_DB_PASSWORD }}
          LABEL_WORKFLOW_DB_PASSWORD: ${{ secrets.LABEL_WORKFLOW_DB_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
        run: |
          : "${STAGING_WINDOW_HOURS:?set the approved staging window duration}"
          : "${STAGING_EXPERIMENT_HOURS:?set the approved experiment duration}"
          : "${STAGING_K6_HOURS:?set the approved k6 duration}"
          : "${STAGING_WINDOW_END_SGT:?set the owner-confirmed shutdown time in Asia/Singapore}"
          : "${APPROVED_STAGING_SPEND_USD:?set the owner-approved staging spend cap}"
          test "$AWS_DEPLOY_ROLE_ARN" = "arn:aws:iam::${AWS_ACCOUNT_ID}:role/FoodLabelFlowStagingDeploy"
          python3 - "$APPROVED_STAGING_SPEND_USD" <<'PY'
          from decimal import Decimal, InvalidOperation
          import sys
          try:
              cap = Decimal(sys.argv[1])
          except InvalidOperation:
              raise SystemExit('Approved staging spend must be a decimal USD amount')
          if not cap.is_finite() or cap <= 0 or cap > Decimal('150'):
              raise SystemExit('Approved staging spend must be within the STCN-17 USD 150 cap')
          PY
          python3 platform/staging/validate_window.py "$STAGING_WINDOW_HOURS" "$STAGING_WINDOW_END_SGT" > "$RUNNER_TEMP/staging-window.json"
          env -u AVAILABLE_CREDIT_USD python3 scripts/aws_staging_budget.py \
            --hours "$STAGING_WINDOW_HOURS" \
            --experiment-hours "$STAGING_EXPERIMENT_HOURS" \
            --k6-hours "$STAGING_K6_HOURS" \
            --approved-spend-usd "$APPROVED_STAGING_SPEND_USD" \
            --require-gate
          if [[ "$OPERATION" == apply ]]; then
            for secret in "$SPECIFICATION_DB_PASSWORD" "$FORMULATION_DB_PASSWORD" "$COMPLIANCE_DB_PASSWORD" "$LABEL_WORKFLOW_DB_PASSWORD" "$KEYCLOAK_DB_PASSWORD"; do
              test -n "$secret"
            done
          fi
          echo 'STAGING_WINDOW_VALIDATED=true' >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify target account and configure the private EKS context
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          EKS_CLUSTER_NAME: ${{ env.EKS_CLUSTER_NAME }}
        run: |
          test "$AWS_REGION" = ap-southeast-1
          test "$AWS_ACCOUNT_ID" = "$(aws sts get-caller-identity --query Account --output text)"
          test "$EKS_CLUSTER_NAME" = spectrace-staging
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Resolve private RDS endpoint and database subnet CIDRs
        if: ${{ inputs.operation == 'apply' }}
        run: |
          set -euo pipefail
          aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" > "$RUNNER_TEMP/cluster.json"
          cluster_vpc=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cluster"]["resourcesVpcConfig"]["vpcId"])' "$RUNNER_TEMP/cluster.json")
          aws rds describe-db-instances --db-instance-identifier spectrace-staging-mysql --region "$AWS_REGION" > "$RUNNER_TEMP/rds.json"
          mapfile -t subnet_ids < <(python3 - "$RUNNER_TEMP/rds.json" <<'PY'
          import json, sys
          rows=json.load(open(sys.argv[1]))['DBInstances']
          assert len(rows)==1
          print('\n'.join(row['SubnetIdentifier'] for row in rows[0]['DBSubnetGroup']['Subnets']))
          PY
          )
          test "${#subnet_ids[@]}" -ge 2
          aws ec2 describe-subnets --subnet-ids "${subnet_ids[@]}" --region "$AWS_REGION" > "$RUNNER_TEMP/rds-subnets.json"
          python3 scripts/staging/resolve_rds_values.py "$RUNNER_TEMP/rds.json" "$RUNNER_TEMP/rds-subnets.json" \
            --vpc-id "$cluster_vpc" --output "$RUNNER_TEMP/rds-runtime-values.json"
          mysql_host=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["mysqlHost"])' "$RUNNER_TEMP/rds-runtime-values.json")
          echo "MYSQL_HOST=$mysql_host" >> "$GITHUB_ENV"
      - name: Apply or remove per-service runtime configuration Secrets
        env:
          OPERATION: ${{ inputs.operation }}
          SPECTRACE_SECURITY_JWKSETURI: http://spectrace-keycloak-service.keycloak.svc.cluster.local:8080/auth/realms/spectrace/protocol/openid-connect/certs
          SPECIFICATION_DB_PASSWORD: ${{ secrets.SPECIFICATION_DB_PASSWORD }}
          FORMULATION_DB_PASSWORD: ${{ secrets.FORMULATION_DB_PASSWORD }}
          COMPLIANCE_DB_PASSWORD: ${{ secrets.COMPLIANCE_DB_PASSWORD }}
          LABEL_WORKFLOW_DB_PASSWORD: ${{ secrets.LABEL_WORKFLOW_DB_PASSWORD }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          GATEWAY_ISSUER: ${{ env.GATEWAY_ISSUER }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          EKS_CLUSTER_NAME: ${{ env.EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == apply ]]; then
            for tool in aws mysql python3; do command -v "$tool" >/dev/null; done
            master_json=$(aws secretsmanager get-secret-value \
              --secret-id spectrace-staging/mysql/master --query SecretString --output text --region "$AWS_REGION")
            master_user=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["username"])' <<< "$master_json")
            master_password=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["password"])' <<< "$master_json")
            unset master_json
            MYSQL_ADMIN_USER="$master_user" MYSQL_ADMIN_PASSWORD="$master_password" \
              bash deploy/mysql/bootstrap-service-databases.sh
            unset master_user master_password
          fi
          bash scripts/staging/apply-runtime-secrets.sh "$OPERATION"
