name: AWS staging window estimate

on:
  push:
    paths:
      - "infra/**"
      - "scripts/aws_staging_budget.py"
      - "tests/test_aws_staging_budget.py"
      - ".github/workflows/aws-staging-budget.yml"
      - ".github/workflows/aws-staging-budget-gate.yml"
      - ".github/workflows/aws-staging-budget-contract.yml"
  pull_request:
    paths:
      - "infra/**"
      - "scripts/aws_staging_budget.py"
      - "tests/test_aws_staging_budget.py"
      - ".github/workflows/aws-staging-budget.yml"
      - ".github/workflows/aws-staging-budget-gate.yml"
      - ".github/workflows/aws-staging-budget-contract.yml"
  workflow_dispatch:
    inputs:
      window_hours:
        description: Planned deployment window in hours
        required: true
        default: "24"
        type: string
      experiment_hours:
        description: Compliance scale-out experiment hours
        required: true
        default: "4"
        type: string
      k6_hours:
        description: k6 load-generator hours
        required: true
        default: "2"
        type: string
      available_credit_usd:
        description: Explicit available AWS credit; blank runs estimate only
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify budget model
        run: python -m unittest discover -s tests -p 'test_aws_staging_budget.py' -v
      - name: Estimate or enforce budget gate
        env:
          WINDOW_HOURS: ${{ inputs.window_hours || '24' }}
          EXPERIMENT_HOURS: ${{ inputs.experiment_hours || '4' }}
          K6_HOURS: ${{ inputs.k6_hours || '2' }}
          AVAILABLE_CREDIT_USD: ${{ inputs.available_credit_usd }}
        run: |
          args=(--hours "$WINDOW_HOURS" --experiment-hours "$EXPERIMENT_HOURS" --k6-hours "$K6_HOURS")
          if [ -n "$AVAILABLE_CREDIT_USD" ]; then
            args+=(--available-credit-usd "$AVAILABLE_CREDIT_USD")
          fi
          python scripts/aws_staging_budget.py "${args[@]}"
