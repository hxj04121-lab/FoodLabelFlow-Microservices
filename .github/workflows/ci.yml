name: CI

on:
  push:
    branches: [main, "chore/**", "feature/**"]
  pull_request:
    branches: [main, XFY, 'codex/stcn-27-*', 'codex/stcn-26-*', 'codex/stcn-28-*', 'feature/stcn-1-g0-m1-contracts', 'g0-m4-label-workflow-contracts', 'feature/stcn-45-outbox-consumer', 'feature/stcn-64-*', 'feature/g3-m2-mainline', 'feature/g3-m2-experiments']

permissions:
  contents: read

jobs:
  database-privileges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start an isolated MySQL 8.4.11 and verify idempotent bootstrap grants
        run: bash scripts/test-service-database-bootstrap.sh | tee database-bootstrap.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-database-grants
          path: database-bootstrap.log
          if-no-files-found: error

  observability-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and exercise DLQ and service error alerts
        run: |
          docker run --rm --entrypoint=/bin/promtool -v "$PWD/deploy/observability/alerts:/etc/prometheus:ro" prom/prometheus:v3.7.3 \
            check rules /etc/prometheus/stcn-15-rules.yml
          docker run --rm --entrypoint=/bin/promtool -v "$PWD/deploy/observability/alerts:/etc/prometheus:ro" prom/prometheus:v3.7.3 \
            test rules /etc/prometheus/stcn-15-rules.test.yml

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend with MySQL Testcontainers
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/jacoco.xml
          if-no-files-found: error
      - name: Upload backend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

  platform-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify starter and service skeletons with MySQL Testcontainers
        run: mvn -B -ntp verify
      - name: Verify the production matcher from a source archive without Git metadata
        run: |
          archive_dir="$(mktemp -d "$RUNNER_TEMP/compliance-source.XXXXXX")"
          git archive --format=tar HEAD | tar -x -C "$archive_dir"
          test ! -e "$archive_dir/.git"
          mvn -B -ntp -f "$archive_dir/pom.xml" -pl services/compliance -am \
            -Dtest=PerformanceDatasetContractTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Upload platform and service coverage
        uses: actions/upload-artifact@v4
        with:
          name: platform-coverage
          path: |
            platform/*/target/site/jacoco/jacoco.xml
            services/*/target/site/jacoco/jacoco.xml
          if-no-files-found: error
      - name: Upload platform and service test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-reports
          path: |
            platform/*/target/surefire-reports/**
            services/*/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Verify starter issuer and JWKS match the Keycloak /auth realm
        run: |
          docker compose -f deploy/local/compose.yaml config --format json > "$RUNNER_TEMP/local-compose.json"
          node - "$RUNNER_TEMP/local-compose.json" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const compose = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedIssuer = process.env.OIDC_ISSUER_URI || 'http://localhost:8180/auth/realms/spectrace';
          const expectedJwks = 'http://keycloak:8080/auth/realms/spectrace/protocol/openid-connect/certs';
          const expectedAudience = 'spectrace-api';
          const expectedHostname = process.env.KEYCLOAK_EXTERNAL_URL || 'http://localhost:8180/auth';
          assert.ok(expectedIssuer.endsWith('/auth/realms/spectrace'), `issuer must use the /auth realm path: ${expectedIssuer}`);
          for (const name of ['specification', 'formulation', 'compliance', 'label-workflow']) {
            const env = compose.services[name]?.environment;
            assert.ok(env, `missing Compose service ${name}`);
            assert.equal(env.SPECTRACE_SECURITY_ISSUERURI, expectedIssuer, `${name} issuer mismatch`);
            assert.equal(env.SPECTRACE_SECURITY_JWKSETURI, expectedJwks, `${name} JWKS mismatch`);
            assert.equal(env.SPECTRACE_SECURITY_AUDIENCE, expectedAudience, `${name} audience mismatch`);
          }
          assert.equal(compose.services.keycloak.environment.KC_HTTP_RELATIVE_PATH, '/auth');
          assert.equal(compose.services.keycloak.environment.KC_HOSTNAME, expectedHostname);
          console.log('PASS: all services use the shared /auth issuer/JWKS and spectrace-api audience');
          NODE
      - name: Build application images
        run: docker compose build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start full stack
        run: docker compose up -d mysql backend frontend
      - name: Validate PASS and blocking FAIL through the browser
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          LIVE_VALIDATION: '1'
        run: npx playwright test tests/validation-live.spec.ts
      - name: Show container logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color mysql backend frontend
      - name: Upload browser validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-browser-evidence
          path: frontend/test-results
          if-no-files-found: warn
      - name: Stop full stack
        if: always()
        run: docker compose down -v

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    # SonarCloud computes a quality gate only for main and pull requests.
    # Waiting on a short-lived branch push fails with a misleading
    # "Not authorized or project not found" error after a successful upload.
    if: ${{ vars.SONARQUBE_ENABLED == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    needs: [backend, frontend, platform-services]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile backend for analysis
        run: mvn -B -ntp -f backend/pom.xml -DskipTests package
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
      - name: Compile platform and services for analysis
        run: mvn -B -ntp -DskipTests package
      - name: Download platform and service coverage
        uses: actions/download-artifact@v4
        with:
          name: platform-coverage
          path: .
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate frontend coverage from browser tests
        working-directory: frontend
        env:
          VITE_COVERAGE: 'true'
        run: |
          npx playwright install chromium
          npx playwright test --grep-invert 'captures.*live'
          npm run test:signin
          npx nyc report --reporter=lcov --reporter=text-summary
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  security:
    runs-on: ubuntu-latest
    if: ${{ vars.SECURITY_SCANS_ENABLED == 'true' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Calculate Dependency-Check cache key
        id: dependency-check-cache-key
        shell: bash
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Dependency-Check data cache
        id: dependency-check-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-${{ steps.dependency-check-cache-key.outputs.date }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: OWASP Dependency-Check
        working-directory: backend
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          args=(
            -B
            -ntp
            org.owasp:dependency-check-maven:12.1.0:check
            -DfailBuildOnCVSS=7
            -DdataDirectory="$HOME/.cache/dependency-check"
            # OSS Index rejects unauthenticated API reports (HTTP 401).
            # The NVD and CISA KEV analyzers remain enabled and enforce the gate.
            -DossindexAnalyzerEnabled=false
          )

          if [[ -n "${NVD_API_KEY:-}" ]]; then
            args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          else
            echo "::notice::NVD_API_KEY is not configured; using unauthenticated NVD API access."
          fi

          for attempt in 1 2; do
            if mvn "${args[@]}"; then
              exit 0
            fi

            # A generated report means Dependency-Check completed its analysis
            # and found a policy failure. Retrying cannot remediate a CVE.
            if [[ -f target/dependency-check-report.html ]]; then
              exit 1
            fi

            if [[ "$attempt" -eq 2 ]]; then
              exit 1
            fi

            echo "Dependency-Check attempt $attempt failed; retrying once after 90 seconds."
            sleep 90
          done
      - name: Save Dependency-Check data cache
        if: ${{ always() && hashFiles('backend/target/dependency-check-report.html') != '' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dependency-check
          key: ${{ runner.os }}-dependency-check-${{ steps.dependency-check-cache-key.outputs.date }}-${{ hashFiles('backend/pom.xml') }}
