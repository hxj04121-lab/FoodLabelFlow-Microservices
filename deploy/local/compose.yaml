# Local SpecTrace-CN platform (G1-M1.2). Run from the repository root:
#   docker compose -f deploy/local/compose.yaml up -d --build
# Infrastructure only:  docker compose -f deploy/local/compose.yaml up -d mysql rabbitmq keycloak
# Credentials below are local-only defaults; staging gets real secrets from the pipeline.
name: spectrace-local

x-identity: &identity
  OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/auth/realms/spectrace}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/auth/realms/spectrace/protocol/openid-connect/certs
  SPECTRACE_SECURITY_ISSUERURI: ${OIDC_ISSUER_URI:-http://localhost:8180/auth/realms/spectrace}
  SPECTRACE_SECURITY_JWKSETURI: http://keycloak:8080/auth/realms/spectrace/protocol/openid-connect/certs
  SPECTRACE_SECURITY_AUDIENCE: spectrace-api

x-service: &service
  depends_on:
    mysql:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 20s

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-only-root}
    ports:
      - "${MYSQL_HOST_PORT:-3316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} -e 'SELECT 1 FROM mysql.user WHERE user=\"label_workflow\"' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-spectrace}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-only-rabbitmq}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-only-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_HOSTNAME: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8180/auth}
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      # Realm as code (G1-M4.1): the local stack gets the spectrace realm, its clients and the demo
      # users from the committed file instead of console clicking, exactly like the standalone
      # deploy/keycloak compose. `start-dev --import-realm` imports every *.json in that directory,
      # so only the realm file is mounted; the container has no named volume, so a rebuilt container
      # imports again.
      - ../keycloak/realm/spectrace-realm.json:/opt/keycloak/data/import/spectrace-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  specification:
    <<: *service
    build:
      context: ../..
      dockerfile: services/specification/Dockerfile
    environment:
      <<: *identity
      SPECTRACE_SEED_REPLAY_ENABLED: ${SEED_REPLAY:-false}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/specification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      # Tokens are issued to the browser at localhost:8180, so iss stays that URL, but inside this network the
      # keys must be fetched from the keycloak container. With a JWK set URI, Spring still validates iss.
      RABBITMQ_HOST: rabbitmq
      SPECTRACE_MESSAGING_DECLARE_TOPOLOGY: "true"
    ports:
      - "${SPECIFICATION_HOST_PORT:-8081}:8080"

  formulation:
    <<: *service
    build:
      context: ../..
      dockerfile: services/formulation/Dockerfile
    environment:
      <<: *identity
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/formulation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      # Tokens are issued to the browser at localhost:8180, so iss stays that URL, but inside this network the
      # keys must be fetched from the keycloak container. With a JWK set URI, Spring still validates iss.
      RABBITMQ_HOST: rabbitmq
      SPECTRACE_MESSAGING_DECLARE_TOPOLOGY: "true"
    ports:
      - "${FORMULATION_HOST_PORT:-8082}:8080"

  compliance:
    <<: *service
    build:
      context: ../..
      dockerfile: services/compliance/Dockerfile
    environment:
      <<: *identity
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/compliance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RABBITMQ_HOST: rabbitmq
      SPECTRACE_MESSAGING_DECLARE_TOPOLOGY: "true"
    ports:
      - "${COMPLIANCE_HOST_PORT:-8083}:8080"

  label-workflow:
    <<: *service
    build:
      context: ../..
      dockerfile: services/label-workflow/Dockerfile
    environment:
      <<: *identity
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/label_workflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RABBITMQ_HOST: rabbitmq
      SPECTRACE_MESSAGING_DECLARE_TOPOLOGY: "true"
    ports:
      - "${LABEL_WORKFLOW_HOST_PORT:-8084}:8080"

volumes:
  mysql-data:
