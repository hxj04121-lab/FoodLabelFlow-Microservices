apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alloy
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spectrace-alloy
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spectrace-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spectrace-alloy
subjects:
  - kind: ServiceAccount
    name: grafana-alloy
    namespace: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spectrace-kube-state-metrics
rules:
  - apiGroups: ["", apps, batch, autoscaling, networking.k8s.io, storage.k8s.io]
    resources: [pods, namespaces, nodes, services, endpoints, persistentvolumeclaims, persistentvolumes, deployments, replicasets, statefulsets, daemonsets, jobs, cronjobs, horizontalpodautoscalers, ingresses, storageclasses]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spectrace-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spectrace-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: observability
