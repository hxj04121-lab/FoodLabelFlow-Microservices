apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: observability
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          args: [--port=8080]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: observability
spec:
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports: [{name: metrics, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: observability
  labels: {app.kubernetes.io/name: grafana-alloy}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: grafana-alloy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana-alloy}
    spec:
      serviceAccountName: grafana-alloy
      securityContext: {runAsNonRoot: true, runAsUser: 473, runAsGroup: 473, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alloy
          image: grafana/alloy:v1.13.0
          args: [run, /etc/alloy/config.alloy, --storage.path=/tmp/alloy]
          envFrom:
            - secretRef: {name: grafana-cloud}
          ports: [{name: http, containerPort: 12345}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy, readOnly: true}
            - {name: tmp, mountPath: /tmp/alloy}
      volumes:
        - {name: config, configMap: {name: grafana-alloy}}
        - {name: tmp, emptyDir: {}}
