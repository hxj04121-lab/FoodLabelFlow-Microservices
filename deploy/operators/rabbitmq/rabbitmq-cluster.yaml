apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: spectrace
  namespace: rabbitmq
  annotations:
    rabbitmq.com/topology-allowed-namespaces: "specification,formulation,compliance,label-workflow"
spec:
  replicas: 3
  image: rabbitmq:4.3.4-management
  persistence:
    storageClassName: ebs-gp3
    storage: 8Gi
  # Sized for three anti-affine brokers on the staging t3.medium general nodes.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/nodegroup
                operator: In
                values: [general]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: spectrace
              app.kubernetes.io/component: rabbitmq
  rabbitmq:
    additionalConfig: |-
      default_queue_type = quorum
      vm_memory_high_watermark.relative = 0.6
  override:
    statefulSet:
      spec:
        persistentVolumeClaimRetentionPolicy:
          whenDeleted: Retain
          whenScaled: Retain
        template:
          spec:
            containers:
              - name: rabbitmq
                # The override replaces the Operator's probes, so each must name its handler.
                readinessProbe:
                  tcpSocket:
                    port: 5672
                  initialDelaySeconds: 20
                  periodSeconds: 10
                livenessProbe:
                  tcpSocket:
                    port: 5672
                  initialDelaySeconds: 60
                  periodSeconds: 20
