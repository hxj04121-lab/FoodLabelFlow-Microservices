apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: specification-rabbitmq
  namespace: specification
spec:
  vhost: /
  userReference: {name: specification-rabbitmq}
  permissions: {configure: "^$", write: "^spectrace\\.events$", read: "^$"}
  rabbitmqClusterReference: {name: spectrace, namespace: rabbitmq}
