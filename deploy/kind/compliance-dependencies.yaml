apiVersion: v1
kind: Secret
metadata:
  name: compliance-kind-mysql
  namespace: compliance
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: kind-only-root
  MYSQL_PASSWORD: kind-only-compliance
---
apiVersion: v1
kind: Secret
metadata:
  name: compliance-runtime
  namespace: compliance
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:mysql://compliance-mysql:3306/compliance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  SPRING_DATASOURCE_USERNAME: compliance
  SPRING_DATASOURCE_PASSWORD: kind-only-compliance
  RABBITMQ_HOST: localhost
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: kind-only
  RABBITMQ_PASSWORD: kind-only
  SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
  SPECTRACE_SECURITY_ISSUERURI: http://keycloak.invalid/realms/spectrace
  SPECTRACE_SECURITY_JWKSETURI: http://keycloak.invalid/realms/spectrace/protocol/openid-connect/certs
  SPECTRACE_SECURITY_AUDIENCE: kind-test
---
apiVersion: v1
kind: Secret
metadata:
  name: compliance-rabbitmq-user-credentials
  namespace: compliance
type: Opaque
stringData:
  username: kind-only
  password: kind-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-mysql
  namespace: compliance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: compliance-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compliance-mysql
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: compliance
          effect: NoSchedule
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: compliance
            - name: MYSQL_USER
              value: compliance
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: compliance-kind-mysql
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: compliance-kind-mysql
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-mysql
  namespace: compliance
spec:
  selector:
    app.kubernetes.io/name: compliance-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
