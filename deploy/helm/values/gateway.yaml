serviceName: gateway
replicaCount: 1
image:
  repository: ghcr.io/hxj04121-lab/foodlabelflow-microservices/gateway
  tag: 573de46
  digest: sha256:d4190ea6ee31b84e7b67d36ad56e6391612c8bdc4916b8bb14d28b9a17f6ab47
  pullPolicy: IfNotPresent
# The current staging cluster has a single general node; multi-zone spread would block scheduling.
spread:
  enabled: false
  minimumZones: 1
env:
  - {name: GATEWAY_REALM, value: spectrace}
  - {name: GATEWAY_AUDIENCE, value: spectrace-api}
  - {name: GATEWAY_ALLOWED_ORIGINS, value: https://hxj04121-lab.github.io}
  - {name: GATEWAY_SPECIFICATION_WRITE_ROLES, value: ADMIN_DATA_MAINTENANCE}
  - {name: GATEWAY_FORMULATION_WRITE_ROLES, value: ADMIN_DATA_MAINTENANCE}
  - {name: GATEWAY_COMPLIANCE_WRITE_ROLES, value: CHANGE_MANAGER}
  - {name: GATEWAY_LABEL_WRITE_ROLES, value: LABEL_OFFICER,APPROVER,PUBLISHER}
networkPolicy:
  enabled: true
  ingressFromServices: []
  allowDNS: true
  egressRules:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: keycloak}
          podSelector:
            matchLabels: {app: keycloak}
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: specification}
          podSelector:
            matchLabels: {app.kubernetes.io/name: specification}
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: formulation}
          podSelector:
            matchLabels: {app.kubernetes.io/name: formulation}
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: compliance}
          podSelector:
            matchLabels: {app.kubernetes.io/name: compliance}
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: label-workflow}
          podSelector:
            matchLabels: {app.kubernetes.io/name: label-workflow}
      ports: [{port: 8080, protocol: TCP}]
