serviceName: compliance
image:
  repository: ghcr.io/hxj04121-lab/foodlabelflow-microservices/compliance
  tag: 5f2e321c9afcc32f32face2913ec2cf9bd10f4fc
  digest: sha256:73aac3f0c86c8b3381d3a58734379eeb771e9202ed4dc657b22c3f628f8f34c6
envFrom:
  - secretRef:
      name: compliance-runtime
resources:
  requests: {cpu: "1", memory: "2Gi"}
  limits: {cpu: "1", memory: "2Gi"}
nodeSelector:
  eks.amazonaws.com/nodegroup: compliance
  node.kubernetes.io/instance-type: c6i.large
tolerations:
  - {key: dedicated, operator: Equal, value: compliance, effect: NoSchedule}
networkPolicy:
  ingressFromPeers:
    - {namespace: gateway, name: gateway}
    - {namespace: label-workflow, name: label-workflow}
    - {namespace: observability, name: grafana-alloy}
  egressRules:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: rabbitmq}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports: [{port: 5672, protocol: TCP}]
