serviceName: formulation
image:
  repository: ghcr.io/hxj04121-lab/foodlabelflow-microservices/formulation
  digest: sha256:bcc315aa8ded81cc8675bae95606c96ecd08101f276ea611e402ce22bb4352c2
env:
  - name: RABBITMQ_HOST
    value: spectrace.rabbitmq.svc.cluster.local
  - name: RABBITMQ_PORT
    value: "5672"
  - name: RABBITMQ_USERNAME
    valueFrom:
      secretKeyRef: {name: formulation-rabbitmq-user-credentials, key: username}
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef: {name: formulation-rabbitmq-user-credentials, key: password}
envFrom:
  - secretRef:
      name: formulation-runtime
networkPolicy:
  ingressFromPeers:
    - {namespace: gateway, name: gateway}
    - {namespace: observability, name: grafana-alloy}
  egressRules:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: rabbitmq}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: spectrace
      ports: [{port: 5672, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: keycloak}
          podSelector:
            matchLabels:
              app: keycloak
      ports: [{port: 8080, protocol: TCP}]
