serviceName: label-workflow
image:
  repository: ghcr.io/hxj04121-lab/foodlabelflow-microservices/label-workflow
  digest: sha256:768c1f7ee6659db7138d48d468eaa7b974d84ca1aa53dd074a8fb74b98695311
env:
  - name: SPECTRACE_LABEL_WORKFLOW_VALIDATION_BASE_URL
    value: http://compliance-compliance.compliance.svc.cluster.local:8080
  - name: RABBITMQ_HOST
    value: spectrace.rabbitmq.svc.cluster.local
  - name: RABBITMQ_PORT
    value: "5672"
  - name: RABBITMQ_USERNAME
    valueFrom:
      secretKeyRef: {name: label-workflow-rabbitmq-user-credentials, key: username}
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef: {name: label-workflow-rabbitmq-user-credentials, key: password}
envFrom:
  - secretRef:
      name: label-workflow-runtime
networkPolicy:
  ingressFromPeers:
    - {namespace: gateway, name: gateway}
    - {namespace: observability, name: grafana-alloy}
  egressRules:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: rabbitmq}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: spectrace
      ports: [{port: 5672, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: keycloak}
          podSelector:
            matchLabels:
              app: keycloak
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: compliance}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: compliance
      ports: [{port: 8080, protocol: TCP}]
