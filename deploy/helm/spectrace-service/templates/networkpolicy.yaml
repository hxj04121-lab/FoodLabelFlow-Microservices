{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spectrace.fullname" . }}
  labels:
    {{- include "spectrace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spectrace.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- range .Values.networkPolicy.ingressFromServices }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . | quote }}
      ports:
        - {port: http, protocol: TCP}
    {{- else }}
    []
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowDNS }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- end }}
    {{- with .Values.networkPolicy.egressRules }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    {{- if not .Values.networkPolicy.allowDNS }}
    []
    {{- end }}
    {{- end }}
{{- end }}
