{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spectrace.fullname" . }}
  labels:
    {{- include "spectrace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spectrace.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if or .Values.networkPolicy.ingressFromServices .Values.networkPolicy.ingressFromPeers .Values.networkPolicy.ingressFromCIDRs }}
  ingress:
    {{- range .Values.networkPolicy.ingressFromServices }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . | quote }}
      ports:
        - {port: http, protocol: TCP}
    {{- end }}
    {{- range .Values.networkPolicy.ingressFromPeers }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name | quote }}
      ports:
        - {port: http, protocol: TCP}
    {{- end }}
    {{- range .Values.networkPolicy.ingressFromCIDRs }}
    - from:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {port: http, protocol: TCP}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  {{- if or .Values.networkPolicy.allowDNS .Values.networkPolicy.egressRules .Values.networkPolicy.databaseCidrs }}
  egress:
    {{- if .Values.networkPolicy.allowDNS }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- end }}
    {{- with .Values.networkPolicy.egressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- range .Values.networkPolicy.databaseCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - {port: 3306, protocol: TCP}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
