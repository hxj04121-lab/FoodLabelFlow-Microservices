apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: spectrace-events
  namespace: {{ .Values.rabbitmq.namespace }}
spec:
  name: {{ .Values.rabbitmq.exchange | quote }}
  type: topic
  durable: true
  autoDelete: false
  rabbitmqClusterReference: {name: {{ .Values.rabbitmq.name }}}
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: spectrace-dlx
  namespace: {{ .Values.rabbitmq.namespace }}
spec:
  name: {{ .Values.rabbitmq.deadLetterExchange | quote }}
  type: topic
  durable: true
  autoDelete: false
  rabbitmqClusterReference: {name: {{ .Values.rabbitmq.name }}}
{{- range $consumer := .Values.consumers }}
{{- $service := $consumer.service }}
{{- $namespace := $consumer.namespace }}
{{- range $queue := $consumer.queues }}
{{- $queueName := printf "%s.%s" $service $queue.name }}
{{- $routingKeys := $queue.routingKeys | default (list $queue.routingKey) }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: {{ printf "%s-%s" $service $queue.name }}
  namespace: {{ $namespace }}
spec:
  name: {{ $queueName | quote }}
  durable: true
  autoDelete: false
  rabbitmqClusterReference: {name: {{ $.Values.rabbitmq.name }}, namespace: {{ $.Values.rabbitmq.namespace }}}
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: {{ printf "%s-%s-dlq" $service $queue.name }}
  namespace: {{ $namespace }}
spec:
  name: {{ printf "%s.dlq" $queueName | quote }}
  durable: true
  autoDelete: false
  rabbitmqClusterReference: {name: {{ $.Values.rabbitmq.name }}, namespace: {{ $.Values.rabbitmq.namespace }}}
{{- range $index, $key := $routingKeys }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: {{ printf "%s-%s-event-%d" $service $queue.name $index }}
  namespace: {{ $namespace }}
spec:
  source: {{ $.Values.rabbitmq.exchange | quote }}
  destination: {{ $queueName | quote }}
  destinationType: queue
  routingKey: {{ $key | quote }}
  rabbitmqClusterReference: {name: {{ $.Values.rabbitmq.name }}, namespace: {{ $.Values.rabbitmq.namespace }}}
{{- end }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: {{ printf "%s-%s-dead-letter" $service $queue.name }}
  namespace: {{ $namespace }}
spec:
  source: {{ $.Values.rabbitmq.deadLetterExchange | quote }}
  destination: {{ printf "%s.dlq" $queueName | quote }}
  destinationType: queue
  routingKey: {{ $queueName | quote }}
  rabbitmqClusterReference: {name: {{ $.Values.rabbitmq.name }}, namespace: {{ $.Values.rabbitmq.namespace }}}
---
apiVersion: rabbitmq.com/v1beta1
kind: Policy
metadata:
  name: {{ printf "%s-%s-delivery-policy" $service $queue.name }}
  namespace: {{ $namespace }}
spec:
  name: {{ printf "%s-%s-delivery-policy" $service $queue.name | quote }}
  pattern: {{ printf "^%s$" (regexQuoteMeta $queueName) | quote }}
  applyTo: queues
  definition:
    delivery-limit: 5
    dead-letter-exchange: {{ $.Values.rabbitmq.deadLetterExchange | quote }}
    dead-letter-routing-key: {{ $queueName | quote }}
  rabbitmqClusterReference: {name: {{ $.Values.rabbitmq.name }}, namespace: {{ $.Values.rabbitmq.namespace }}}
{{- end }}
{{- end }}