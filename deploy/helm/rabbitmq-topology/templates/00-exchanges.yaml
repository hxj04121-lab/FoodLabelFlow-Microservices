apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: spectrace-events
  namespace: {{ .Values.rabbitmq.namespace }}
spec:
  name: {{ .Values.rabbitmq.exchange | quote }}
  type: topic
  durable: true
  autoDelete: false
  rabbitmqClusterReference: {name: {{ .Values.rabbitmq.name }}}
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: spectrace-dlx
  namespace: {{ .Values.rabbitmq.namespace }}
spec:
  name: {{ .Values.rabbitmq.deadLetterExchange | quote }}
  type: topic
  durable: true
  autoDelete: false
  rabbitmqClusterReference: {name: {{ .Values.rabbitmq.name }}}
