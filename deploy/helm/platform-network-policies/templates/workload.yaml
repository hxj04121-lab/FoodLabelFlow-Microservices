{{- $gatewayNS := index .Values.namespaces "gateway" -}}
{{- $monitoringNS := index .Values.namespaces "observability" -}}
{{- $rabbitmqNS := index .Values.namespaces "rabbitmq" -}}
{{- $keycloakNS := index .Values.namespaces "keycloak" -}}
{{- range $service := list "specification" "formulation" "compliance" "label-workflow" }}
{{- $namespace := index $.Values.namespaces $service }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stcn-{{ $service }}-flows
  namespace: {{ $namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $service | quote }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gatewayNS | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $monitoringNS | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana-alloy
      ports:
        - {protocol: TCP, port: 8080}
    {{- if eq $service "compliance" }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ index $.Values.namespaces "label-workflow" | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: label-workflow
      ports:
        - {protocol: TCP, port: 8080}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $rabbitmqNS | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: spectrace
      ports:
        - {protocol: TCP, port: 5672}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $keycloakNS | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        {{- range $.Values.cidrs.database }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: 3306}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $monitoringNS | quote }}
      ports:
        - {protocol: TCP, port: 4317}
---
{{- end }}
